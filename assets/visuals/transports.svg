<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
<rect width="1200" height="300" fill="#FFFFFF"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0891B2"/></marker></defs>
<text x="40" y="52" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#0B1F4A">Two transports, one protocol</text>
<text x="40" y="82" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#475569">Stdio for local servers. Streamable HTTP for remote ones.</text>
<rect x="40" y="98" width="90" height="5" fill="#0891B2"/>
<rect x="40" y="140" width="242" height="90" rx="12" fill="#0B1F4A"/>
<text x="161.0" y="181.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF">Host</text>
<text x="161.0" y="205.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#BFE3F2">launches or connects</text>
<line x1="286" y1="185" x2="328" y2="185" stroke="#0891B2" stroke-width="3" marker-end="url(#ah)"/>
<rect x="332" y="140" width="242" height="90" rx="12" fill="#E0F2FE"/>
<text x="453.0" y="181.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#0B1F4A">stdio</text>
<text x="453.0" y="205.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#33506E">subprocess, newline JSON</text>
<line x1="578" y1="185" x2="620" y2="185" stroke="#0891B2" stroke-width="3" marker-end="url(#ah)"/>
<rect x="624" y="140" width="242" height="90" rx="12" fill="#E0F2FE"/>
<text x="745.0" y="181.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#0B1F4A">Streamable HTTP</text>
<text x="745.0" y="205.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#33506E">one endpoint, POST and stream</text>
<line x1="870" y1="185" x2="912" y2="185" stroke="#0891B2" stroke-width="3" marker-end="url(#ah)"/>
<rect x="916" y="140" width="242" height="90" rx="12" fill="#0B1F4A"/>
<text x="1037.0" y="181.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF">Server</text>
<text x="1037.0" y="205.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#BFE3F2">same messages either way</text>
<text x="40" y="275" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#475569">The older HTTP plus SSE shape (two endpoints) is deprecated since the 2025-03-26 revision.</text>
</svg>